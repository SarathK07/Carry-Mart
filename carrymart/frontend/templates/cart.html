{% extends "base.html" %}
{% block content %}

<h3 class="mb-4">🛒 Your Cart</h3>

<table class="table table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th width="150">Quantity</th>
            <th>Total</th>
            <th>Remove</th>
        </tr>
    </thead>
    <tbody id="cartBody"></tbody>
</table>

<h4 class="text-end">
    Grand Total: ₹ <span id="grandTotal">0</span>
</h4>
<div class="text-end mt-3">
    <button class="btn btn-success btn-lg"
        onclick="placeOrder()">
        🛍 Place Order
    </button>
</div>

<script>
async function loadCart(){
    const token = localStorage.getItem("access");

    const response = await fetch("/cart/viewcart/", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const items = await response.json();
    cartBody.innerHTML = "";
    let total = 0;

    items.forEach(item => {

        const imageUrl = item.image
            ? item.image
            : "https://via.placeholder.com/60";

        const itemTotal = parseFloat(item.price) * item.quantity;
        total += itemTotal;

        cartBody.innerHTML += `
        <tr>
            <td>
                <div class="d-flex align-items-center">
                    <img src="${imageUrl}"
                         width="60" height="60"
                         style="object-fit:cover;"
                         class="me-2 rounded">
                    ${item.product_name}
                </div>
            </td>

            <td>₹ ${item.price}</td>

            <td>
                <button class="btn btn-sm btn-secondary"
                    onclick="updateQty(${item.id}, ${item.quantity - 1})">-</button>

                ${item.quantity}

                <button class="btn btn-sm btn-secondary"
                    onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
            </td>

            <td>₹ ${itemTotal}</td>

            <td>
                <button class="btn btn-danger btn-sm"
                    onclick="removeItem(${item.id})">
                    Remove
                </button>
            </td>
        </tr>
        `;
    });

    grandTotal.innerText = total.toFixed(2);
}

async function updateQty(itemId, newQty){
    const token = localStorage.getItem("access");

    if(newQty <= 0){
        removeItem(itemId);
        return;
    }

    await fetch("/cart/update/", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            item_id: itemId,      // ✅ correct
            quantity: newQty
        })
    });

    loadCart();
}

async function removeItem(itemId){
    const token = localStorage.getItem("access");

    await fetch("/cart/delete/", {
        method: "POST",          // ✅ your backend uses POST not DELETE
        headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            item_id: itemId      // ✅ correct
        })
    });

    loadCart();
}

function placeOrder(){
    window.location.href = "/payment-options/";
}

loadCart();
</script>

{% endblock %}
